name: Build and Push Docker Image

on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descarga el código
        uses: actions/checkout@v4

      - name: Construimos una imagen temporal
        run: docker build -t imagen_test .

      - name: Ejecutamos los Tests
        run: docker run --rm -u 1001 -v ${{ github.workspace }}:/app/test imagen_test

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Subimos a dockerhub la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: oscar12ugr/iv25-26:latest